[phases.setup]
nixPkgs = [
    "python311Packages.supervisor",
    "nginx",
    "php82Packages.php-fpm",
    "nodejs",
    "yarn"
]

[phases.build]
cmds = [
    "composer install --no-interaction --no-dev --optimize-autoloader",

    "yarn install --frozen-lockfile || npm install",
    "yarn build || npm run build",

    "mkdir -p /etc/supervisor/conf.d",
    "mkdir -p /var/log",
    "chmod +x /assets/start.sh"
]

[start]
cmd = "/assets/start.sh"

[staticAssets]

"start.sh" = '''
#!/usr/bin/env bash
set -e

export APP_ENV=${APP_ENV:-production}

php artisan migrate --force || true

php artisan optimize:clear || true
php artisan config:cache || true
php artisan route:cache || true
php artisan view:cache || true
php artisan event:cache || true

chown -R www-data:www-data /app/storage /app/bootstrap/cache || true

exec supervisord -c /etc/supervisord.conf -n
'''

"supervisord.conf" = '''
[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-nginx.conf" = '''
[program:nginx]
command=nginx -c /etc/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
'''

"worker-phpfpm.conf" = '''
[program:php-fpm]
command=php-fpm -y /assets/php-fpm.conf -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
'''

"worker-laravel.conf" = '''
[program:laravel-queue]
command=php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
'''

"php-fpm.conf" = '''
[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
clear_env = no
'''

"nginx.conf" = '''
user www-data www-data;
worker_processes auto;
daemon off;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile on;

  server {
    listen ${PORT};
    server_name _;

    root /app/public;
    index index.php;

    client_max_body_size 35M;

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_index index.php;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
      deny all;
    }
  }
}
'''